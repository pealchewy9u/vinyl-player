<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl Collection</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFF8EC">
<style>
  :root {
    --background: #FFF8EC;
    --surface: #FBEFDB;
    --surface-raised: #F5E6C8;
    --brass: #E8823D;
    --maroon: #C62828;
    --text: #3A2615;
    --text-muted: #8A7355;
    --groove: #EFE0C4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--background);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100%;
    overscroll-behavior-y: contain;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    background: var(--background);
    flex-shrink: 0;
  }
  .header-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; min-width: 0; }
  #settings-btn {
    border: 1px solid var(--groove); border-radius: 10px; background: var(--surface);
    color: var(--text-muted); padding: 9px 11px; min-height: 40px; cursor: pointer;
    font-size: 18px; line-height: 1;
  }
  #refresh-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--groove); border-radius: 10px;
    background: var(--surface); color: var(--brass); padding: 9px 12px;
    font: 600 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    cursor: pointer; flex-shrink: 0; min-height: 40px;
  }
  #refresh-btn:active { background: var(--surface-raised); }
  #refresh-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  #refresh-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  @media (max-width: 360px) { h1 { font-size: 20px; } #refresh-btn { padding: 8px 10px; } }

  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border-radius: 10px; padding: 9px 12px;
    margin-bottom: 8px;
  }
  .search-row input {
    border: none; outline: none; background: transparent; flex: 1;
    font-size: 15px; color: var(--text);
  }
  .search-row input::placeholder { color: var(--text-muted); }

  select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--groove);
    background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 4px;
  }

  .tabs { display: flex; gap: 5px; padding: 0 16px 10px; flex-shrink: 0; }
  .tab {
    flex: 1; text-align: center; min-width: 0; padding: 9px 0; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    background: var(--surface);
  }
  .tab.active { background: var(--brass); color: white; }

  main { flex: 1; overflow: hidden; position: relative; }

  /* ---- List view ---- */
  #list-view { display: none; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 30px; }
  .record-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--groove);
  }
  .cover-thumb, .cover-placeholder {
    width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-raised); overflow: hidden;
  }
  .cover-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .record-meta { flex: 1; min-width: 0; }
  .record-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .category-badge {
    font-size: 10px; font-weight: 600; color: #4A1B0C; background: var(--surface-raised);
    padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .empty-state { padding: 60px 24px; text-align: center; color: var(--text-muted); }

  /* ---- Cover Flow view ---- */
  #coverflow-view { height: 100%; display: flex; flex-direction: column; }
  .cf-scroll {
    flex: 1; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    padding: 0 calc(50vw - 85px);
    perspective: 700px;
  }
  .cf-scroll::-webkit-scrollbar { display: none; }
  .cf-card {
    scroll-snap-align: center; flex-shrink: 0; width: 170px; margin: 0 10px;
    display: flex; flex-direction: column; align-items: center;
    transition: transform 0.05s linear, opacity 0.05s linear;
  }
  .cf-cover, .cf-cover-placeholder {
    width: 170px; height: 170px; border-radius: 8px;
    box-shadow: 0 14px 28px rgba(58,38,21,0.45), 0 4px 10px rgba(58,38,21,0.3);
    display: flex; align-items: center; justify-content: center; background: var(--surface-raised);
    overflow: hidden;
    font-size: 48px;
  }
  .cf-cover img { width: 100%; height: 100%; object-fit: cover; }
  .cf-reflection, .cf-reflection-placeholder {
    width: 170px; height: 85px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; background: var(--surface-raised);
    overflow: hidden; font-size: 48px;
    transform: scaleY(-1); margin-top: -2px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.28), transparent);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.28), transparent);
  }
  .cf-reflection img { width: 100%; height: 170px; object-fit: cover; display: block; }
  .cf-caption {
    text-align: center; padding: 10px 20px 0; flex-shrink: 0;
    height: 92px; /* fixed regardless of text length, so the layout below never shifts */
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  .cf-title {
    font-size: 17px; font-weight: 700; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cf-artist {
    font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cf-category { margin-top: 20px; text-align: center; padding-bottom: 20px; }

  /* ---- Detail sheet ---- */
  #detail-overlay {
    position: fixed; inset: 0; background: rgba(58,38,21,0.4); display: none;
    align-items: flex-end; z-index: 50;
  }
  #detail-sheet {
    background: var(--background); width: 100%; max-height: 82vh; border-radius: 18px 18px 0 0;
    overflow-y: auto; padding: 20px 20px calc(30px + env(safe-area-inset-bottom));
  }
  .sheet-close { text-align: right; }
  .sheet-close button {
    border: none; background: var(--surface-raised); color: var(--text);
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
  }
  .sheet-cover {
    width: 110px; height: 110px; border-radius: 8px; margin: 10px 0; background: var(--surface-raised);
    overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .sheet-cover img { width: 100%; height: 100%; object-fit: cover; }
  .sheet-title { font-size: 20px; font-weight: 700; }
  .sheet-artist { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .sheet-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; font-size: 13px; }
  .field-label { color: var(--text-muted); font-size: 11px; }
  .field-value { font-weight: 500; }
  .tracklist { margin-top: 18px; }
  .track-row { padding: 7px 0; border-bottom: 1px solid var(--groove); font-size: 13px; }
  .track-warning { color: var(--maroon); font-size: 11px; font-weight: 600; margin-top: 2px; }

  #summary-view, #value-view { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 30px; display: none; }
  .summary-total { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .summary-section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .cat-row { margin-bottom: 12px; }
  .cat-row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .cat-bar-track { background: var(--groove); border-radius: 4px; height: 8px; overflow: hidden; }
  .cat-bar-fill { background: var(--brass); height: 100%; border-radius: 4px; }
  .stat-blocks { display: flex; gap: 40px; margin-top: 24px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--brass); }
  .stat-label { font-size: 12px; color: var(--text-muted); }
  .purchase-summary { display: flex; gap: 12px; margin: 0 0 8px; flex-wrap: wrap; }
  .purchase-summary > div { flex: 1; min-width: 135px; background: var(--surface); border-radius: 10px; padding: 12px; }
  .purchase-sum { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .purchase-note { color: var(--text-muted); font-size: 11px; margin-bottom: 22px; }


  /* Calmer dashboard: one clear total, secondary details, optional category breakdown. */
  #summary-view, #value-view { padding: 12px 16px calc(45px + env(safe-area-inset-bottom)); }
  .summary-hero { background: var(--surface); border: 1px solid var(--groove); border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  .summary-eyebrow { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .summary-hero-value { font-size: clamp(26px, 7vw, 35px); font-weight: 750; letter-spacing: -0.8px; margin: 7px 0; line-height: 1.14; overflow-wrap: anywhere; }
  .summary-hero-secondary { font-size: 15px; color: var(--text-muted); font-weight: 500; }
  .summary-card { background: var(--surface); border: 1px solid var(--groove); border-radius: 15px; padding: 16px; margin: 12px 0; }
  .summary-card-title { font-size: 15px; font-weight: 700; margin-bottom: 11px; }
  .summary-row { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--groove); font-size: 13px; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row span:first-child { color: var(--text-muted); }
  .summary-row strong { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
  .summary-tiny { color: var(--text-muted); font-size: 12px; line-height: 1.45; }
  .summary-count-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 15px; }
  .summary-count { background: var(--surface); border: 1px solid var(--groove); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .summary-count strong { display: block; font-size: 21px; }
  .summary-count span { color: var(--text-muted); font-size: 11px; }
  .summary-disclosure { background: var(--surface); border: 1px solid var(--groove); border-radius: 15px; padding: 15px; margin: 12px 0; }
  .summary-disclosure summary { font-weight: 700; font-size: 15px; cursor: pointer; }
  .summary-disclosure .cat-row:first-of-type { margin-top: 20px; }
  .summary-fx { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .summary-fx input { width: 74px; border: 1px solid var(--groove); border-radius: 9px; padding: 8px; font-size: 13px; background: var(--surface); color: var(--text); }
  .summary-fx button { border: 1px solid var(--groove); border-radius: 9px; padding: 8px 12px; background: var(--surface-raised); color: var(--text); font-weight: 600; }
  #settings-overlay {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: rgba(58,38,21,.38); align-items: center; justify-content: center; padding: 20px;
  }
  .settings-panel { width: min(100%, 420px); border-radius: 18px; background: var(--background);
    padding: 22px; box-shadow: 0 12px 36px rgba(58,38,21,.22); }
  .settings-panel label { display: block; margin: 14px 0 7px; font-size: 13px; color: var(--text-muted); }
  .settings-panel input { width: 100%; border: 1px solid var(--groove); border-radius: 9px;
    padding: 11px; background: var(--surface); color: var(--text); font-size: 16px; }
  .settings-panel button { border: 1px solid var(--groove); border-radius: 9px;
    padding: 9px 15px; background: var(--surface-raised); color: var(--text); cursor: pointer; }
  .sheet-price-card { display: flex; flex-direction: column; gap: 6px; padding: 13px; background: var(--surface); border: 1px solid var(--groove); border-radius: 12px; margin: 12px 0; }
  .sheet-price-card .field-value { font-size: 20px; font-weight: 700; }
  @media (min-width: 620px) { #summary-view, #value-view { max-width: 680px; margin: auto; width: 100%; } }

  #status-bar {
    font-size: 11px; color: var(--text-muted); text-align: center; padding: 6px 0 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-title-row">
      <h1>Vinyl Collection</h1>
      <button id="refresh-btn" type="button" aria-label="Refresh collection" title="Refresh collection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18.1 6.3L20 12M4 12l1.9 5.7A7 7 0 0 0 18.4 15"/></svg>
        <span>Refresh</span>
      </button>
      <button id="settings-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
    <div class="search-row">
      <span>🔍</span>
      <input id="search-input" type="text" placeholder="Search artist, album, catalog number…">
    </div>
    <div style="display:flex; gap:8px;">
      <select id="category-select" style="flex:1;"><option value="">All Categories</option></select>
      <select id="ownership-select" style="flex:1;">
        <option value="">New &amp; Pre-Owned</option>
        <option value="New">New</option>
        <option value="Pre-Owned">Pre-Owned</option>
      </select>
    </div>
  </header>

  <div class="tabs">
    <div class="tab" data-view="list">List</div>
    <div class="tab active" data-view="coverflow">Cover Flow</div>
    <div class="tab" data-view="summary">Summary</div>
    <div class="tab" data-view="value">Value</div>
  </div>

  <main>
    <div id="list-view"></div>
    <div id="coverflow-view">
      <div class="cf-scroll" id="cf-scroll"></div>
      <div class="cf-caption" id="cf-caption"></div>
    </div>
    <div id="summary-view"></div>
    <div id="value-view"></div>
  </main>

  <div id="status-bar">
    <span id="status-text">Loading…</span>
  </div>
</div>

<div id="settings-overlay" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="settings-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <strong style="font-size:20px">Settings</strong>
      <button id="settings-close" type="button">Close</button>
    </div>
    <label for="settings-fx-rate">Currency conversion — INR per $1</label>
    <input type="number" id="settings-fx-rate" min="0.01" step="0.01" inputmode="decimal" />
    <div class="summary-tiny" style="margin:10px 0 18px">Changes approximate display amounts only, not purchase prices or online quotes. This setting is stored on this phone.</div>
    <button id="settings-save" type="button">Save conversion rate</button>
  </div>
</div>

<div id="detail-overlay">
  <div id="detail-sheet"></div>
</div>

<script>
const DATA_URL = './collection.json';
let records = [];
let currentView = 'coverflow';
// Approximate conversion is display-only, separate from original purchase amounts.
const DEFAULT_INR_PER_USD = 95; // Approx. Nov 3, 2026; manually adjustable.
let inrPerUSD = Number(localStorage.getItem('vinyl-fx-rate')) || DEFAULT_INR_PER_USD;
if (!(inrPerUSD > 0)) inrPerUSD = DEFAULT_INR_PER_USD;
function currencyAmount(amount, code) {
  return new Intl.NumberFormat(code === 'USD' ? 'en-US' : 'en-IN', {
    style: 'currency', currency: code, maximumFractionDigits: 0, minimumFractionDigits: 0
  }).format(amount);
}
function numericPrice(r) {
  const raw = r.pricePaid;
  if (raw === undefined || raw === null || String(raw).trim() === '') return null;
  const amount = Number(String(raw).replace(/,/g, ''));
  return Number.isFinite(amount) && amount >= 0 ? Math.ceil(amount) : null;
}

function numericCurrentValue(r) {
  const raw = r.estimatedValue;
  if (raw === undefined || raw === null || String(raw).trim() === '') return null;
  const amount = Number(String(raw).replace(/,/g, ''));
  return Number.isFinite(amount) && amount >= 0 ? amount : null;
}
function onlineAskComparison(r) {
  if (r.marketPriceStatus !== 'Listed') return '';
  const paid = numericPrice(r), ask = numericCurrentValue(r);
  if (paid === null || ask === null || paid <= 0) return '';
  const paidINR = paid * (r.purchaseCurrency === 'USD' ? inrPerUSD : 1);
  const askINR = ask * (currentValueCurrency(r) === 'USD' ? inrPerUSD : 1);
  const change = askINR - paidINR;
  const percent = Math.abs(change / paidINR * 100);
  if (percent < 1) return 'About the same asking price as you paid';
  return currencyAmount(Math.abs(change), 'INR') + (change > 0 ? ' above' : ' below') + ' your purchase cost (' + Math.round(percent) + '%)';
}

function currentValueCurrency(r) {
  return (r.currentValueCurrency || r.purchaseCurrency) === 'USD' ? 'USD' : 'INR';
}
function currentValueText(r) {
  const amount = numericCurrentValue(r);
  if (amount === null) return 'Not entered';
  const code = currentValueCurrency(r);
  return code === 'USD'
    ? currencyAmount(amount, 'USD') + ' / ' + currencyAmount(amount * inrPerUSD, 'INR')
    : currencyAmount(amount, 'INR') + ' / ' + currencyAmount(amount / inrPerUSD, 'USD');
}


async function loadData() {
  document.getElementById('status-text').textContent = 'Loading…';
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    records = await res.json();
    localStorage.setItem('vinyl-cache', JSON.stringify(records));
    const now = new Date();
    localStorage.setItem('vinyl-cache-time', now.toISOString());
    document.getElementById('status-text').textContent =
      records.length + ' records · updated ' + now.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch (e) {
    const cached = localStorage.getItem('vinyl-cache');
    if (cached) {
      records = JSON.parse(cached);
      const t = localStorage.getItem('vinyl-cache-time');
      document.getElementById('status-text').textContent =
        'Offline — showing data from ' + (t ? new Date(t).toLocaleDateString() : 'last sync');
    } else {
      document.getElementById('status-text').textContent = 'Could not load collection data.';
    }
  }
  buildCategoryFilter();
  render();
}

function buildCategoryFilter() {
  const sel = document.getElementById('category-select');
  const cats = [...new Set(records.map(r => r.category).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All Categories</option>' +
    cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filteredRecords() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const cat = document.getElementById('category-select').value;
  const ownership = document.getElementById('ownership-select').value;
  return records
    .filter(r => !cat || r.category === cat)
    .filter(r => !ownership || r.ownership === ownership)
    .filter(r => {
      if (!q) return true;
      const hay = [r.artist, r.albumTitle, r.catalogNumber, r.language].join(' ').toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => (a.albumTitle || '').localeCompare(b.albumTitle || ''));
}

function coverHtml(record, cls, placeholderCls) {
  if (!record.photoFilename) {
    return `<div class="${placeholderCls}">💿</div>`;
  }
  // Looks for the image in a photos/ folder uploaded alongside collection.json.
  // onerror swaps in the placeholder if that specific file isn't there --
  // e.g. you haven't uploaded every photo yet, or a filename doesn't match --
  // rather than showing a broken image icon.
  const src = `./Photos/${encodeURIComponent(record.photoFilename)}`;
  return `<div class="${cls}"><img src="${src}" loading="lazy"
    onerror="this.parentElement.outerHTML='<div class=&quot;${placeholderCls}&quot;>💿</div>'"></div>`;
}

function render() {
  if (currentView === 'list') renderList();
  else if (currentView === 'coverflow') renderCoverFlow();
  else if (currentView === 'summary') renderSummary();
  else renderCollectionValue();
}

function renderSummary() {
  const container = document.getElementById('summary-view');
  if (!records.length) {
    container.innerHTML = '<div class="empty-state">No collection records yet.</div>';
    return;
  }
  const counts = {};
  for (const r of records) {
    const key = r.category || 'Uncategorized';
    counts[key] = (counts[key] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const maximum = Math.max(1, ...sorted.map(row => row[1]));
  const newCount = records.filter(r => r.ownership === 'New').length;
  const usedCount = records.filter(r => r.ownership === 'Pre-Owned').length;
  container.innerHTML = `
    <div class="summary-total">${records.length} records total</div>
    <div class="summary-count-strip">
      <div class="summary-count"><strong>${newCount}</strong><span>New</span></div>
      <div class="summary-count"><strong>${usedCount}</strong><span>Pre-owned</span></div>
      <div class="summary-count"><strong>${sorted.length}</strong><span>Categories</span></div>
    </div>
    <div class="summary-section-title">By Category</div>
    ${sorted.map(([category, count]) => `
      <div class="cat-row">
        <div class="cat-row-top"><span>${escapeHtml(category)}</span><span>${count}</span></div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${count / maximum * 100}%"></div></div>
      </div>
    `).join('')}
  `;
}

function renderCollectionValue() {
  const container = document.getElementById('value-view');
  if (records.length === 0) {
    container.innerHTML = '<div class="empty-state">Add some records to see a breakdown here.</div>';
    return;
  }

  const counts = {};
  records.forEach(r => {
    const cat = r.category || 'Uncategorized';
    counts[cat] = (counts[cat] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const maxCount = Math.max(...sorted.map(([, c]) => c));

  const priceTotals = { INR: 0, USD: 0 };
  const priceCounts = { INR: 0, USD: 0 };
  records.forEach(r => {
    const amount = numericPrice(r);
    if (amount === null) return;
    const currency = r.purchaseCurrency === 'USD' ? 'USD' : 'INR';
    priceTotals[currency] += amount;
    priceCounts[currency]++;
  });
  const formatTotal = (currency) => new Intl.NumberFormat(currency === 'USD' ? 'en-US' : 'en-IN', {
    style: 'currency', currency, maximumFractionDigits: 0, minimumFractionDigits: 0
  }).format(priceTotals[currency]);

  const listedRecords = records.filter(r => r.marketPriceStatus === 'Listed' && numericCurrentValue(r) !== null);
  const fallbackRecords = records.filter(r =>
    !(r.marketPriceStatus === 'Listed' && numericCurrentValue(r) !== null) && numericPrice(r) !== null);
  const missingCount = records.length - listedRecords.length - fallbackRecords.length;
  const listedTotalINR = listedRecords.reduce((total, r) => total + numericCurrentValue(r) *
    (currentValueCurrency(r) === 'USD' ? inrPerUSD : 1), 0);
  const fallbackTotalINR = fallbackRecords.reduce((total, r) => total + numericPrice(r) *
    (r.purchaseCurrency === 'USD' ? inrPerUSD : 1), 0);
  const indicativeTotalINR = listedTotalINR + fallbackTotalINR;
  const comparableOnline = listedRecords.filter(r => numericPrice(r) !== null);
  const comparedDifferenceINR = comparableOnline.reduce((total, r) => total +
    numericCurrentValue(r) * (currentValueCurrency(r) === 'USD' ? inrPerUSD : 1) -
    numericPrice(r) * (r.purchaseCurrency === 'USD' ? inrPerUSD : 1), 0);

  const newCount = records.filter(r => r.ownership === 'New').length;
  const preOwnedCount = records.filter(r => r.ownership === 'Pre-Owned').length;

  const combinedINR = priceTotals.INR + priceTotals.USD * inrPerUSD;
  const combinedUSD = combinedINR / inrPerUSD;
  container.innerHTML = `
    <div class="summary-hero">
      <div class="summary-eyebrow">TOTAL COLLECTION PURCHASE COST</div>
      <div class="summary-hero-value">${currencyAmount(combinedINR, 'INR')}</div>
      <div class="summary-hero-secondary">${currencyAmount(combinedUSD, 'USD')} · approximate conversion</div>
    </div>
    <div class="summary-count-strip">
      <div class="summary-count"><strong>${records.length}</strong><span>Records</span></div>
      <div class="summary-count"><strong>${newCount}</strong><span>New</span></div>
      <div class="summary-count"><strong>${preOwnedCount}</strong><span>Pre-owned</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-card-title">Your purchase breakdown</div>
      <div class="summary-row"><span>INR · ${priceCounts.INR} records</span><strong>${formatTotal('INR')}</strong></div>
      <div class="summary-row"><span>USD · ${priceCounts.USD} records</span><strong>${formatTotal('USD')}</strong></div>
    </div>
      <div class="summary-tiny" style="margin-top:8px">The exchange rate changes the display only, not what you paid.</div>
    </div>
    <div class="summary-card">
      <div class="summary-card-title">Indicative collection value</div>
      <div class="summary-row"><span>Combined reference value</span><strong>${currencyAmount(indicativeTotalINR, 'INR')}</strong></div>
      <div class="summary-row"><span>Approx. USD</span><strong>${currencyAmount(indicativeTotalINR / inrPerUSD, 'USD')}</strong></div>
      <div class="summary-row"><span>Difference from purchase</span><strong>${comparedDifferenceINR >= 0 ? '+' : ''}${currencyAmount(comparedDifferenceINR, 'INR')} (${combinedINR > 0 ? (comparedDifferenceINR / combinedINR * 100).toFixed(1) : '0.0'}%)</strong></div>
      <div class="summary-row"><span>Online asking prices · ${listedRecords.length} records</span><strong>${currencyAmount(listedTotalINR, 'INR')}</strong></div>
      <div class="summary-row"><span>Purchase-price fallback · ${fallbackRecords.length} records</span><strong>${currencyAmount(fallbackTotalINR, 'INR')}</strong></div>
      ${missingCount ? `<div class="summary-tiny">${missingCount} records have neither an online price nor a purchase price.</div>` : ''}
      <div class="summary-tiny" style="margin-top:10px">Online figures use lowest active Discogs asking prices (excluding shipping). Other records use what you paid as a reference, not a verified current market quote. Fallbacks contribute zero change.</div>
    </div>
  `;

}

function renderList() {
  const list = document.getElementById('list-view');
  const items = filteredRecords();
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">No records match.</div>';
    return;
  }
  list.innerHTML = items.map(r => `
    <div class="record-row" data-id="${r.id}">
      ${coverHtml(r, 'cover-thumb', 'cover-placeholder')}
      <div class="record-meta">
        <div class="record-title">${escapeHtml(r.albumTitle || 'Untitled')}</div>
        <div class="record-artist">${escapeHtml(r.artist || 'Unknown Artist')}</div>
      </div>
      <div class="category-badge">${escapeHtml(r.category || '')}</div>
    </div>
  `).join('');
  list.querySelectorAll('.record-row').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
  });
}

function renderCoverFlow() {
  const scroll = document.getElementById('cf-scroll');
  const items = filteredRecords();
  scroll.innerHTML = items.map(r => `
    <div class="cf-card" data-id="${r.id}">
      ${coverHtml(r, 'cf-cover', 'cf-cover-placeholder')}
      ${coverHtml(r, 'cf-reflection', 'cf-reflection-placeholder')}
    </div>
  `).join('');

  function updateTiltAndCaption() {
    const containerRect = scroll.getBoundingClientRect();
    const containerCenter = containerRect.left + containerRect.width / 2;
    let closestIdx = 0, closestDist = Infinity;

    scroll.querySelectorAll('.cf-card').forEach((el, idx) => {
      const rect = el.getBoundingClientRect();
      const cardCenter = rect.left + rect.width / 2;
      // Distance from this card's center to the container's center, in "card widths" --
      // 0 = dead center, 1 = one card away, etc. This is what drives the tilt/scale,
      // the same idea as the Mac app's Cover Flow but computed from real layout
      // positions during scroll instead of a tracked offset value.
      const dist = (cardCenter - containerCenter) / 190;
      const clamped = Math.max(-3, Math.min(3, dist));
      const scale = Math.max(0.6, 1 - Math.abs(clamped) * 0.18);
      const rotation = clamped * -50;
      const opacity = Math.abs(clamped) > 2.6 ? 0 : 1;
      el.style.transform = `scale(${scale}) rotateY(${rotation}deg)`;
      el.style.opacity = opacity;
      el.style.zIndex = Math.round(10 - Math.abs(clamped));

      if (Math.abs(dist) < closestDist) { closestDist = Math.abs(dist); closestIdx = idx; }
    });

    const r = items[closestIdx];
    const caption = document.getElementById('cf-caption');
    if (!r) { caption.innerHTML = ''; return; }
    caption.innerHTML = `
      <div class="cf-title">${escapeHtml(r.albumTitle || 'Untitled')}</div>
      <div class="cf-artist">${escapeHtml(r.artist || 'Unknown Artist')}</div>
    `;
  }
  scroll.onscroll = () => requestAnimationFrame(updateTiltAndCaption);
  scroll.querySelectorAll('.cf-card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
  });
  // Initial layout pass -- requestAnimationFrame so getBoundingClientRect reads
  // positions after the browser has actually laid the cards out.
  requestAnimationFrame(updateTiltAndCaption);
}

function openDetail(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  const dupIndex = {};
  records.forEach(rec => (rec.tracks || []).forEach(t => {
    const key = (t.songTitle || '').trim().toLowerCase();
    if (!key) return;
    dupIndex[key] = dupIndex[key] || [];
    if (!dupIndex[key].includes(rec.albumTitle)) dupIndex[key].push(rec.albumTitle);
  }));

  const tracksHtml = (r.tracks || []).map(t => {
    const key = (t.songTitle || '').trim().toLowerCase();
    const others = (dupIndex[key] || []).filter(title => title !== r.albumTitle);
    return `<div class="track-row">
      ${escapeHtml(String(t.trackNumber || ''))}. ${escapeHtml(t.songTitle || '')}
      ${others.length ? `<div class="track-warning">⚠ Also on: ${escapeHtml(others.join(', '))}</div>` : ''}
    </div>`;
  }).join('') || '<div class="field-label">No tracklist recorded.</div>';

  document.getElementById('detail-sheet').innerHTML = `
    <div class="sheet-close"><button onclick="closeDetail()">Close</button></div>
    ${coverHtml(r, 'sheet-cover', 'sheet-cover')}
    <div class="sheet-title">${escapeHtml(r.albumTitle || 'Untitled')}</div>
    <div class="sheet-artist">${escapeHtml(r.artist || 'Unknown Artist')}</div>
    <div class="sheet-price-card"><div class="field-label">YOU PAID</div><div class="field-value">${escapeHtml(purchasePrice(r))}</div></div>
    ${r.marketPriceStatus === 'Listed' && numericCurrentValue(r) !== null ? `<div class="sheet-price-card">
      <div class="field-label">LOWEST ONLINE ASKING PRICE · ${Number(r.marketListingsCount || 0)} listed</div>
      <div class="field-value">${escapeHtml(currentValueText(r))}</div>
      <div class="field-label">Discogs · checked ${escapeHtml(r.marketPriceCheckedAt ? new Date(r.marketPriceCheckedAt).toLocaleDateString() : 'unknown')}</div>
      <div class="field-label">${escapeHtml(onlineAskComparison(r))}</div>
      ${r.marketPriceSource && /^https:\/\/www\.discogs\.com\/sell\/release\/\d+$/.test(r.marketPriceSource) ? `<a href="${escapeHtml(r.marketPriceSource)}" target="_blank" rel="noopener noreferrer">View current listing</a>` : ''}
    </div>` : `<div class="sheet-price-card"><div class="field-label">INDICATIVE PRICE · PURCHASE-PRICE FALLBACK</div>
      <div class="field-value">${escapeHtml(numericPrice(r) !== null ? purchasePrice(r) : 'No price available')}</div>
      <div class="field-label">No verified online quote. This is your purchase cost, not a current listing.</div></div>`}
    <div class="sheet-fields">
      <div><div class="field-label">Music Director</div><div class="field-value">${escapeHtml(r.musicDirector || '—')}</div></div>
      <div><div class="field-label">Year</div><div class="field-value">${escapeHtml(r.year || '—')}</div></div>
      <div><div class="field-label">Label</div><div class="field-value">${escapeHtml(r.label || '—')}</div></div>
      <div><div class="field-label">Catalog Number</div><div class="field-value">${escapeHtml(r.catalogNumber || '—')}</div></div>
      <div><div class="field-label">Condition</div><div class="field-value">${escapeHtml(r.ownership || '—')}</div></div>
      <div><div class="field-label">Category</div><div class="field-value">${escapeHtml(r.category || '—')}</div></div>
    </div>
    <div class="tracklist">
      <div class="field-label" style="margin-bottom:6px;">TRACKLIST</div>
      ${tracksHtml}
    </div>
  `;
  document.getElementById('detail-overlay').style.display = 'flex';
}
function closeDetail() { document.getElementById('detail-overlay').style.display = 'none'; }

function purchasePrice(record) {
  const amount = numericPrice(record);
  if (amount === null) return '—';
  const code = record.purchaseCurrency === 'USD' ? 'USD' : 'INR';
  return code === 'USD'
    ? currencyAmount(amount, 'USD') + ' / ' + currencyAmount(amount * inrPerUSD, 'INR')
    : currencyAmount(amount, 'INR') + ' / ' + currencyAmount(amount / inrPerUSD, 'USD');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('list-view').style.display = currentView === 'list' ? 'block' : 'none';
    document.getElementById('coverflow-view').style.display = currentView === 'coverflow' ? 'flex' : 'none';
    document.getElementById('summary-view').style.display = currentView === 'summary' ? 'block' : 'none';
    document.getElementById('value-view').style.display = currentView === 'value' ? 'block' : 'none';
    render();
  });
});

document.getElementById('search-input').addEventListener('input', render);
document.getElementById('category-select').addEventListener('change', render);
document.getElementById('ownership-select').addEventListener('change', render);
document.getElementById('refresh-btn').addEventListener('click', loadData);
document.getElementById('settings-btn').addEventListener('click', () => {
  document.getElementById('settings-fx-rate').value = String(inrPerUSD);
  document.getElementById('settings-overlay').style.display = 'flex';
});
function closeSettings() { document.getElementById('settings-overlay').style.display = 'none'; }
document.getElementById('settings-close').addEventListener('click', closeSettings);
document.getElementById('settings-overlay').addEventListener('click', e => {
  if (e.target.id === 'settings-overlay') closeSettings();
});
document.getElementById('settings-save').addEventListener('click', () => {
  const rate = Number(document.getElementById('settings-fx-rate').value);
  if (!Number.isFinite(rate) || rate <= 0) { alert('Enter a valid rate greater than zero.'); return; }
  inrPerUSD = rate;
  localStorage.setItem('vinyl-fx-rate', String(rate));
  closeSettings();
  render();
});

document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target.id === 'detail-overlay') closeDetail();
});

// Deliberately NOT registering a service worker right now -- iOS is notoriously
// slow to re-check an installed Home Screen PWA's service worker for updates,
// which was causing code changes to silently never show up. Actively clean up
// any previously-registered one too, so a phone that already installed the old
// version doesn't stay stuck on it. We can reintroduce offline support later
// once the app itself has settled and isn't changing every few minutes.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister());
  });
}
if ('caches' in window) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

loadData();
</script>
</body>
